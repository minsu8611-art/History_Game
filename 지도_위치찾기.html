<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>역사수업 지역 찾기</title>
<style>
  :root{
    --bg:#F7F1E1;
    --paper:#FBF8F0;
    --ink:#262220;
    --ink-soft:#6b6259;
    --blue:#1F5C8B;
    --red:#C1362E;
    --yellow:#E3A72E;
    --green:#3E7A5D;
    --cta:#CB6A2F;
    --purple:#7B3F6B;
    --line: rgba(38,34,32,0.16);
    --line-soft: rgba(38,34,32,0.22);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    overflow:hidden;
  }
  .app{ height:100%; display:flex; flex-direction:column; }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;border-bottom:1px solid var(--line);
    background:var(--paper); flex-shrink:0; gap:8px;
  }
  .topbar h1{ font-size:18px;margin:0;font-weight:800;letter-spacing:-0.2px; }
  .topbar .sub{ font-size:12px;color:var(--ink-soft);font-weight:500;margin-top:2px; }
  .topbar-actions{ display:flex;gap:8px;align-items:center;flex-shrink:0; }
  select#presetSelect{
    font-size:14px;font-weight:700;padding:9px 10px;border-radius:10px;
    border:1.5px solid var(--line);background:var(--paper);color:var(--ink);max-width:30vw;
  }
  button{ font-family:inherit;cursor:pointer;border:none; }
  .icon-btn{
    font-size:14px;font-weight:700;padding:9px 14px;border-radius:10px;
    background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);
  }
  .icon-btn:active{ transform:scale(0.96); }
  .ghost-btn{
    font-size:14px;font-weight:700;padding:9px 16px;border-radius:10px;
    background:transparent;border:1.5px solid var(--line-soft);color:var(--ink-soft);
  }
  .cta-btn{
    font-size:16px;font-weight:800;padding:12px 20px;border-radius:12px;
    background:var(--cta);color:var(--paper);
  }
  .cta-btn:active{ transform:scale(0.97); }

  .stage{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:12px;min-height:0;width:100%;
  }
  .clue-box{
    width:100%;max-width:440px;
    background:var(--paper);border-radius:14px;padding:12px 16px;
    box-shadow:0 4px 10px rgba(38,34,32,0.1);
    text-align:center;flex-shrink:0;
  }
  .clue-eyebrow{ font-size:11px;font-weight:800;color:var(--cta);letter-spacing:1.5px;margin:0 0 4px; }
  .clue-text{ font-size:15px;font-weight:700;line-height:1.4;margin:0; }
  .feedback-text{ font-size:13px;font-weight:800;margin-top:6px;min-height:18px; }
  .feedback-text.correct{ color:var(--green); }
  .feedback-text.wrong{ color:var(--red); }

  .region-grid{
    flex:1;min-height:0;width:100%;max-width:440px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(6,1fr);
    gap:6px;
    grid-template-areas:
      "pyeongan pyeongan hamgyong hamgyong"
      "hwanghae hwanghae gangwon gangwon"
      "gyeonggi gyeonggi gangwon gangwon"
      "chungcheong chungcheong gyeongsang gyeongsang"
      "jeolla jeolla gyeongsang gyeongsang"
      ". jeju jeju .";
  }
  .region-block{
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    font-weight:800;font-size:13px;color:var(--paper);
    padding:4px;
    border:3px solid transparent;
    transition:transform 0.1s ease;
  }
  .region-block:active{ transform:scale(0.96); }
  .region-block.correct{ border-color:var(--green); box-shadow:0 0 0 2px var(--green) inset; }
  .region-block.wrong{ border-color:var(--red); box-shadow:0 0 0 2px var(--red) inset; }
  .region-block.reveal{ border-color:var(--green); box-shadow:0 0 0 2px var(--green) inset; opacity:0.9; }

  .controls-row{ display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;flex-shrink:0; }
  .score-info{
    font-size:13px;font-weight:700;color:var(--ink-soft);
    background:var(--paper);padding:6px 12px;border-radius:20px;border:1px solid var(--line);
  }

  .overlay{
    position:fixed;inset:0;background:rgba(38,34,32,0.55);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay.hidden{ display:none; }
  .panel{
    background:var(--paper);border-radius:18px;padding:20px;
    width:min(92vw,480px);max-height:88vh;overflow:auto;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
  }
  .panel-head{ display:flex;justify-content:space-between;align-items:center;margin-bottom:8px; }
  .panel-head h2{ margin:0;font-size:18px;font-weight:800; }
  .panel .field-label{ display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:12px 0 6px; }
  .panel-row{ display:flex;gap:8px;margin-top:14px; }
  .panel-row .cta-btn, .panel-row .ghost-btn{ flex:1; }
  #presetNameInput{
    width:100%;font-size:15px;padding:11px 12px;border-radius:10px;
    border:1.5px solid var(--line);font-family:inherit;
  }
  .hint-text{ font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5; }

  .item-list{ display:flex;flex-direction:column;gap:6px;margin-bottom:6px; }
  .item-card{
    border:1.5px solid var(--line-soft);border-radius:10px;padding:8px 10px;
    background:var(--bg);
  }
  .item-top-row{ display:flex;align-items:center;gap:8px; }
  .item-slot{
    flex:1;padding:8px 10px;border-radius:8px;background:var(--paper);
    border:1.5px solid var(--line-soft);font-size:13px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .item-slot:active{ transform:scale(0.97); }
  .item-slot.clue-slot{ font-weight:500;font-size:12.5px;color:var(--ink-soft);margin-top:6px; }
  .item-region-tag{
    flex-shrink:0;font-size:11px;font-weight:800;padding:6px 8px;border-radius:8px;color:var(--paper);
  }
  .item-del{
    width:32px;height:32px;border-radius:8px;flex-shrink:0;
    background:var(--paper);border:1.5px solid var(--red);color:var(--red);
    font-size:15px;font-weight:800;
  }
  .item-del:active{ transform:scale(0.9); }

  .slot-edit-overlay{
    position:fixed;inset:0;background:rgba(38,34,32,0.6);
    display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;
  }
  .slot-edit-overlay.hidden{ display:none; }
  .slot-edit-card{ background:var(--paper);border-radius:16px;padding:20px;width:min(88vw,380px); }
  .slot-edit-card h3{ margin:0 0 12px;font-size:16px;font-weight:800; }
  .slot-edit-card label{ display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:10px 0 4px; }
  .slot-edit-card input, .slot-edit-card select{
    width:100%;font-size:16px;padding:11px;border-radius:10px;
    border:1.5px solid var(--line-soft);font-family:inherit;background:var(--paper);color:var(--ink);
  }

  .result-card{
    background:var(--paper);border-radius:20px;padding:30px 26px;
    width:min(90vw,420px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.35);
    animation:popIn 0.35s cubic-bezier(0.2,0.8,0.2,1);
  }
  @keyframes popIn{ from{transform:scale(0.7);opacity:0;} to{transform:scale(1);opacity:1;} }
  .result-eyebrow{ margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:2px;color:var(--cta); }
  .result-text{ margin:0 0 22px;font-size:22px;font-weight:900;line-height:1.4; }
  .confetti-layer{ position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:49; }
  .confetti-piece{
    position:absolute;top:-20px;width:10px;height:16px;opacity:0.9;
    animation-name:fall;animation-timing-function:linear;animation-fill-mode:forwards;
  }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(540deg); opacity:0.2; } }
  .menu-back{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;margin-bottom:6px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px;font-weight:800;}
  @media(max-width:640px){
    .topbar{flex-wrap:wrap;gap:8px;padding:10px 12px;}
    .topbar>div:first-child{flex:1 1 100%;}
    .topbar h1{white-space:nowrap;}
    .topbar-actions{flex:1 1 100%;flex-wrap:wrap;justify-content:flex-start;}
    .topbar-actions select{max-width:none !important;flex:1 1 150px;min-height:44px;}
    .topbar-actions button{min-height:44px;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <a class="menu-back" href="index.html">← 메뉴</a>
      <h1>지역 찾기</h1>
      <div class="sub">여행바구니 · 어린이 역사체험</div>
    </div>
    <div class="topbar-actions">
      <select id="presetSelect"></select>
      <button id="editBtn" class="icon-btn">항목 편집</button>
    </div>
  </header>

  <main class="stage">
    <div class="clue-box">
      <p class="clue-eyebrow">이곳은 어느 지역일까요?</p>
      <p class="clue-text" id="clueText">-</p>
      <p class="feedback-text" id="feedbackText"></p>
    </div>
    <div class="region-grid" id="regionGrid"></div>
    <div class="controls-row">
      <span class="score-info" id="scoreInfo"></span>
      <button id="restartBtn" class="ghost-btn">다시 하기</button>
    </div>
  </main>
</div>

<div id="editOverlay" class="overlay hidden">
  <div class="panel">
    <div class="panel-head">
      <h2>항목 편집</h2>
      <button id="closeEdit" class="icon-btn">닫기</button>
    </div>
    <label class="field-label">탭해서 이름·설명·지역을 바꾸거나, ×로 삭제하세요</label>
    <div class="item-list" id="itemList"></div>
    <div class="panel-row">
      <button id="addLocationBtn" class="ghost-btn">+ 새 위치 추가</button>
    </div>

    <label class="field-label">다른 이름으로 저장 (선택)</label>
    <input type="text" id="presetNameInput" placeholder="예: 우리 지역 답사 코스">
    <div class="panel-row">
      <button id="saveAsBtn" class="ghost-btn">이 이름으로 저장</button>
      <button id="deletePresetBtn" class="ghost-btn">이 목록 삭제</button>
    </div>
    <div class="hint-text">조선시대 8도 체제(평안·함경·황해·강원·경기·충청·전라·경상)에 제주를 더해 9개 지역으로 구분했어요. 제주도는 조선시대엔 전라도 소속이었고, 1946년에 별도 도(道)가 됐어요 — 여기선 구분을 쉽게 하려고 따로 뒀습니다.</div>
  </div>
</div>

<div id="slotEditOverlay" class="slot-edit-overlay hidden">
  <div class="slot-edit-card">
    <h3 id="slotEditTitle">위치 정보 입력</h3>
    <label>장소 이름</label>
    <input type="text" id="nameInput">
    <label>설명(퀴즈로 보여줄 힌트)</label>
    <input type="text" id="clueInput">
    <label>정답 지역</label>
    <select id="regionSelect"></select>
    <div class="panel-row">
      <button id="slotEditCancel" class="ghost-btn">취소</button>
      <button id="slotEditConfirm" class="cta-btn">확인</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay hidden">
  <div class="result-card">
    <p class="result-eyebrow">결과</p>
    <p class="result-text" id="resultText">-</p>
    <button id="closeResult" class="cta-btn">다시 하기</button>
  </div>
</div>
<div id="confettiLayer" class="confetti-layer"></div>

<script>
(function(){
  var REGIONS = [
    {key:'pyeongan', name:'평안도', color:'#1F5C8B'},
    {key:'hamgyong', name:'함경도', color:'#C1362E'},
    {key:'hwanghae', name:'황해도', color:'#E3A72E'},
    {key:'gangwon', name:'강원도', color:'#3E7A5D'},
    {key:'gyeonggi', name:'경기도', color:'#CB6A2F'},
    {key:'chungcheong', name:'충청도', color:'#1F5C8B'},
    {key:'jeolla', name:'전라도', color:'#C1362E'},
    {key:'gyeongsang', name:'경상도', color:'#E3A72E'},
    {key:'jeju', name:'제주도', color:'#7B3F6B'}
  ];
  var REGION_MAP = {};
  REGIONS.forEach(function(r){ REGION_MAP[r.key] = r; });

  var presets = {
    "삼국시대 주요 도시": {
      items: [
        {name:"경주(신라 금성)", clue:"신라의 수도였고, 불국사와 석굴암이 있어요.", region:"gyeongsang"},
        {name:"부여(백제 사비)", clue:"백제가 마지막으로 도읍을 옮긴 곳이에요.", region:"chungcheong"},
        {name:"공주(백제 웅진)", clue:"백제가 한성을 잃은 뒤 도읍을 옮긴 곳이에요.", region:"chungcheong"},
        {name:"평양(고구려)", clue:"장수왕이 도읍을 옮긴 고구려의 수도예요.", region:"pyeongan"},
        {name:"서울(한성, 백제 초기 수도)", clue:"백제가 처음 나라를 세운 한강 유역이에요.", region:"gyeonggi"},
        {name:"김해(금관가야)", clue:"김수로왕이 세운 금관가야의 중심지예요.", region:"gyeongsang"},
        {name:"고령(대가야)", clue:"가야 연맹 후기를 이끌었던 대가야의 중심지예요.", region:"gyeongsang"},
        {name:"익산", clue:"백제 무왕 때 지어진 미륵사지가 있는 곳이에요.", region:"jeolla"},
        {name:"철원", clue:"궁예가 세운 태봉의 도읍이었던 곳이에요.", region:"gangwon"},
        {name:"함안(아라가야)", clue:"가야 연맹의 하나였던 아라가야의 중심지예요.", region:"gyeongsang"},
        {name:"나주", clue:"마한의 한 정치 세력이 자리했던 곳으로 여겨져요.", region:"jeolla"},
        {name:"함흥", clue:"동예·옥저가 있던 함경도 동해안 지역이에요.", region:"hamgyong"}
      ]
    },
    "고려·조선 주요 도시": {
      items: [
        {name:"개성(고려 개경)", clue:"고려의 수도였어요.", region:"gyeonggi"},
        {name:"서울(한양)", clue:"조선의 수도였어요.", region:"gyeonggi"},
        {name:"안동", clue:"이황과 관련된 도산서원이 있는 곳이에요.", region:"gyeongsang"},
        {name:"전주", clue:"조선 왕실(전주 이씨)의 본향으로 여겨지는 곳이에요.", region:"jeolla"},
        {name:"평양", clue:"고려의 서경(西京)이자, 조선시대 관서 지방의 중심지였어요.", region:"pyeongan"},

        {name:"남원", clue:"춘향전의 배경으로 유명한 조선시대 고을이에요.", region:"jeolla"},
        {name:"청주", clue:"현재 전하는 가장 오래된 금속활자본, 직지심체요절이 인쇄된 곳이에요.", region:"chungcheong"},
        {name:"진주", clue:"조선시대 경상우병영이 있던 고을이에요.", region:"gyeongsang"},

        {name:"함흥", clue:"조선을 세운 태조 이성계의 고향이에요.", region:"hamgyong"}
      ]
    },
    "임진왜란 전투 위치": {
      items: [
        {name:"부산", clue:"임진왜란이 시작되며 처음 전투가 벌어진 곳이에요.", region:"gyeongsang"},
        {name:"진주", clue:"김시민 장군이 큰 승리를 거둔 곳이에요.", region:"gyeongsang"},

        {name:"충주(탄금대)", clue:"신립 장군이 배수의 진을 치고 싸우다 패배한 곳이에요.", region:"chungcheong"},

        {name:"의령", clue:"곽재우가 최초로 의병을 일으킨 곳이에요.", region:"gyeongsang"}
      ]
    },
    "근현대사 주요 장소": {
      items: [
        {name:"서울", clue:"3·1 운동과 대한민국 정부 수립이 이루어진 곳이에요.", region:"gyeonggi"},
        {name:"부산", clue:"6·25 전쟁 때 임시 수도였어요.", region:"gyeongsang"},
        {name:"인천", clue:"6·25 전쟁의 전세를 뒤바꾼 상륙작전이 있었던 곳이에요.", region:"gyeonggi"},
        {name:"판문점", clue:"정전협정이 체결된 곳이에요.", region:"gyeonggi"},
        {name:"광주", clue:"1980년 민주화운동이 일어난 곳이에요.", region:"jeolla"},
        {name:"강화도", clue:"1876년 개항의 계기가 된 조약이 체결된 곳이에요.", region:"gyeonggi"},
        {name:"대구", clue:"1960년, 부정선거에 항의하는 학생들의 2·28 시위가 일어난 곳이에요.", region:"gyeongsang"},

        {name:"천안(아우내장터)", clue:"유관순 열사가 만세운동을 이끈 곳이에요.", region:"chungcheong"},
        {name:"화성(제암리)", clue:"3·1 운동 직후 일제가 마을 주민들을 학살한 곳이에요.", region:"gyeonggi"},

        {name:"밀양", clue:"항일 무장단체 의열단을 이끈 김원봉의 고향이에요.", region:"gyeongsang"},
        {name:"안동", clue:"1919년, 유림들이 파리평화회의에 독립을 청원한 운동을 이끈 곳이에요.", region:"gyeongsang"},
        {name:"부산", clue:"안희제가 독립운동 자금을 조달하려고 백산상회를 세운 곳이에요.", region:"gyeongsang"},

    },
    "조선왕조실록 사고(史庫)": {

        {name:"봉화(태백산사고)", clue:"태백산 자락에 실록을 보관하던 사고가 있었어요.", region:"gyeongsang"},
        {name:"평창(오대산사고)", clue:"오대산에 실록을 보관하던 사고가 있었어요.", region:"gangwon"},
        {name:"무주(적상산사고)", clue:"적상산에 실록을 보관하던 사고가 있었어요.", region:"jeolla"},
        {name:"서울(춘추관)", clue:"임진왜란 이전, 궁궐 안에 있던 원래의 실록 보관소예요.", region:"gyeonggi"},
        {name:"충주", clue:"임진왜란 이전, 4대 사고 중 하나가 있었던 곳이에요.", region:"chungcheong"},
        {name:"전주", clue:"임진왜란 때 유일하게 불타지 않고 지켜진 사고가 있던 곳이에요.", region:"jeolla"},
        {name:"성주", clue:"임진왜란 이전, 4대 사고 중 하나가 있었던 곳이에요.", region:"gyeongsang"}

    },
    "근대 개항장": {
      items: [

        {name:"원산", clue:"1880년에 개항한 북쪽의 항구 도시예요.", region:"hamgyong"},

        {name:"목포", clue:"1897년에 개항한 서남해안의 항구 도시예요.", region:"jeolla"},

        {name:"진남포", clue:"1897년에 개항한 대동강 하구의 항구예요.", region:"pyeongan"},
        {name:"마산", clue:"1899년, 군산과 같은 해에 개항한 남해안의 항구예요.", region:"gyeongsang"}
      ]
    },
    "6·25전쟁 격전지": {
      items: [
        {name:"칠곡(다부동)", clue:"낙동강 방어선을 지켜낸 치열한 전투가 벌어진 곳이에요.", region:"gyeongsang"},
        {name:"철원(백마고지)", clue:"고지를 뺏고 빼앗기며 여러 차례 주인이 바뀐 격전지예요.", region:"gangwon"},
        {name:"영덕(장사리)", clue:"어린 학도병들이 상륙작전에 참전한 곳이에요.", region:"gyeongsang"},
        {name:"거제도", clue:"전쟁 중 포로수용소가 있던 섬이에요.", region:"gyeongsang"},
        {name:"오산(죽미령)", clue:"미군이 참전 후 처음으로 북한군과 교전한 곳이에요.", region:"gyeonggi"},
        {name:"양평(지평리)", clue:"국군과 유엔군이 중공군의 공세를 막아낸 전투가 벌어진 곳이에요.", region:"gyeonggi"},
        {name:"양구", clue:"펀치볼·도솔산 등 격전이 벌어진 강원도 산악 지역이에요.", region:"gangwon"}
      ]

  };
  var currentName = "삼국시대 주요 도시";

  var presetSelect = document.getElementById('presetSelect');
  var regionGrid = document.getElementById('regionGrid');
  var clueText = document.getElementById('clueText');
  var feedbackText = document.getElementById('feedbackText');
  var scoreInfo = document.getElementById('scoreInfo');
  var restartBtn = document.getElementById('restartBtn');

  var editOverlay = document.getElementById('editOverlay');
  var itemList = document.getElementById('itemList');
  var presetNameInput = document.getElementById('presetNameInput');

  var slotEditOverlay = document.getElementById('slotEditOverlay');
  var slotEditTitle = document.getElementById('slotEditTitle');
  var nameInput = document.getElementById('nameInput');
  var clueInput = document.getElementById('clueInput');
  var regionSelect = document.getElementById('regionSelect');
  var editingIdx = -1;

  var resultOverlay = document.getElementById('resultOverlay');
  var resultText = document.getElementById('resultText');
  var confettiLayer = document.getElementById('confettiLayer');

  var order = [];
  var qPointer = 0;
  var score = 0;
  var mode = 'answer';
  var regionEls = {};

  function refreshPresetSelect(){
    presetSelect.innerHTML = '';
    Object.keys(presets).forEach(function(name){
      var opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      if(name === currentName) opt.selected = true;
      presetSelect.appendChild(opt);
    });
  }

  function buildRegionGrid(){
    regionGrid.innerHTML = '';
    regionEls = {};
    REGIONS.forEach(function(r){
      var el = document.createElement('div');
      el.className = 'region-block';
      el.style.gridArea = r.key;
      el.style.background = r.color;
      el.textContent = r.name;
      el.addEventListener('click', function(){ onRegionTap(r.key); });
      regionGrid.appendChild(el);
      regionEls[r.key] = el;
    });
  }

  function clearFeedback(){
    Object.keys(regionEls).forEach(function(k){
      regionEls[k].classList.remove('correct','wrong','reveal');
    });
  }

  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }

  function startRound(){
    var items = presets[currentName].items;
    order = shuffle(items.map(function(_,i){ return i; }));
    qPointer = 0;
    score = 0;
    mode = 'answer';
    clearFeedback();
    showQuestion();
  }

  function showQuestion(){
    var items = presets[currentName].items;
    if(qPointer >= order.length){
      finishRound();
      return;
    }
    var item = items[order[qPointer]];
    clueText.textContent = item.clue;
    feedbackText.textContent = '';
    feedbackText.className = 'feedback-text';
    clearFeedback();
    mode = 'answer';
    updateScoreInfo();
  }

  function updateScoreInfo(){
    scoreInfo.textContent = '문제 ' + Math.min(qPointer+1, order.length) + ' / ' + order.length + ' · 맞은 개수 ' + score;
  }

  function finishRound(){
    resultText.textContent = order.length + '문제 중 ' + score + '개 맞혔어요!';
    resultOverlay.classList.remove('hidden');
    if(score === order.length) launchConfetti();
  }

  function onRegionTap(key){
    if(mode !== 'answer') return;
    var items = presets[currentName].items;
    var target = items[order[qPointer]];
    mode = 'locked';
    var isCorrect = (key === target.region);

    if(isCorrect){
      regionEls[key].classList.add('correct');
      feedbackText.textContent = '정확해요! · ' + target.name + ' (' + REGION_MAP[target.region].name + ')';
      feedbackText.className = 'feedback-text correct';
      score++;
    } else {
      regionEls[key].classList.add('wrong');
      regionEls[target.region].classList.add('reveal');
      feedbackText.textContent = '아쉬워요! ' + target.name + '은(는) ' + REGION_MAP[target.region].name + '예요.';
      feedbackText.className = 'feedback-text wrong';
    }
    updateScoreInfo();

    setTimeout(function(){
      qPointer++;
      showQuestion();
    }, 1400);
  }

  restartBtn.addEventListener('click', startRound);
  document.getElementById('closeResult').addEventListener('click', function(){
    resultOverlay.classList.add('hidden');
    startRound();
  });

  presetSelect.addEventListener('change', function(){
    currentName = presetSelect.value;
    startRound();
  });

  // ---------- 편집 패널 ----------
  function refreshRegionSelect(){
    regionSelect.innerHTML = '';
    REGIONS.forEach(function(r){
      var opt = document.createElement('option');
      opt.value = r.key; opt.textContent = r.name;
      regionSelect.appendChild(opt);
    });
  }

  function renderEditPanel(){
    var items = presets[currentName].items;
    itemList.innerHTML = '';
    items.forEach(function(item, idx){
      var card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML =
        '<div class="item-top-row">' +
          '<div class="item-slot" data-idx="'+idx+'"></div>' +
          '<span class="item-region-tag"></span>' +
          '<button class="item-del" data-idx="'+idx+'">×</button>' +
        '</div>' +
        '<div class="item-slot clue-slot" data-idx="'+idx+'"></div>';
      card.querySelector('.item-slot').textContent = item.name;
      var tag = card.querySelector('.item-region-tag');
      tag.textContent = REGION_MAP[item.region].name;
      tag.style.background = REGION_MAP[item.region].color;
      card.querySelector('.clue-slot').textContent = item.clue;
      itemList.appendChild(card);
    });
    Array.prototype.forEach.call(itemList.querySelectorAll('.item-slot'), function(el){
      el.addEventListener('click', function(){
        openEditExisting(+el.getAttribute('data-idx'));
      });
    });
    Array.prototype.forEach.call(itemList.querySelectorAll('.item-del'), function(el){
      el.addEventListener('click', function(){
        var idx = +el.getAttribute('data-idx');
        if(presets[currentName].items.length <= 2){
          alert('최소 2개의 위치가 있어야 합니다.');
          return;
        }
        presets[currentName].items.splice(idx,1);
        renderEditPanel();
      });
    });
    presetNameInput.value = '';
  }

  function openEditExisting(idx){
    editingIdx = idx;
    var item = presets[currentName].items[idx];
    slotEditTitle.textContent = '위치 정보 수정';
    nameInput.value = item.name;
    clueInput.value = item.clue;
    refreshRegionSelect();
    regionSelect.value = item.region;
    slotEditOverlay.classList.remove('hidden');
    setTimeout(function(){ nameInput.focus(); }, 50);
  }

  document.getElementById('addLocationBtn').addEventListener('click', function(){
    editingIdx = -1;
    slotEditTitle.textContent = '새 위치 정보 입력';
    nameInput.value = '';
    clueInput.value = '';
    refreshRegionSelect();
    slotEditOverlay.classList.remove('hidden');
    setTimeout(function(){ nameInput.focus(); }, 50);
  });

  document.getElementById('slotEditConfirm').addEventListener('click', function(){
    var nm = nameInput.value.trim();
    var cl = clueInput.value.trim();
    var rg = regionSelect.value;
    if(!nm || !cl){
      alert('이름과 설명을 모두 입력해 주세요.');
      return;
    }
    if(editingIdx === -1){
      presets[currentName].items.push({name:nm, clue:cl, region:rg});
    } else {
      presets[currentName].items[editingIdx] = {name:nm, clue:cl, region:rg};
    }
    slotEditOverlay.classList.add('hidden');
    renderEditPanel();
  });
  document.getElementById('slotEditCancel').addEventListener('click', function(){
    slotEditOverlay.classList.add('hidden');
  });

  document.getElementById('editBtn').addEventListener('click', function(){
    renderEditPanel();
    editOverlay.classList.remove('hidden');
  });
  document.getElementById('closeEdit').addEventListener('click', function(){
    editOverlay.classList.add('hidden');
    startRound();
  });
  document.getElementById('saveAsBtn').addEventListener('click', function(){
    var name = presetNameInput.value.trim();
    if(!name){
      alert('저장할 이름을 입력해 주세요.');
      return;
    }
    presets[name] = { items: presets[currentName].items.map(function(o){
      return {name:o.name, clue:o.clue, region:o.region};
    }) };
    currentName = name;
    refreshPresetSelect();
    renderEditPanel();
  });
  document.getElementById('deletePresetBtn').addEventListener('click', function(){
    var names = Object.keys(presets);
    if(names.length <= 1){
      alert('마지막 남은 목록은 삭제할 수 없습니다.');
      return;
    }
    delete presets[currentName];
    currentName = Object.keys(presets)[0];
    refreshPresetSelect();
    editOverlay.classList.add('hidden');
    startRound();
  });

  function launchConfetti(){
    var colors = ["#1F5C8B","#C1362E","#E3A72E","#3E7A5D","#CB6A2F"];
    for(var i=0;i<26;i++){
      var el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = (Math.random()*100) + 'vw';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      var dur = 1.6 + Math.random()*1.2;
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = (Math.random()*0.3) + 's';
      confettiLayer.appendChild(el);
      (function(node, d){ setTimeout(function(){ node.remove(); }, (d+0.5)*1000); })(el, dur);
    }
  }

  refreshPresetSelect();
  buildRegionGrid();
  startRound();
})();
</script>
