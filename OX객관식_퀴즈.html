<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>역사수업 OX·객관식 퀴즈</title>
<style>
  :root{
    --bg:#F7F1E1;
    --paper:#FBF8F0;
    --ink:#262220;
    --ink-soft:#6b6259;
    --blue:#1F5C8B;
    --red:#C1362E;
    --yellow:#E3A72E;
    --green:#3E7A5D;
    --cta:#CB6A2F;
    --line: rgba(38,34,32,0.16);
    --line-soft: rgba(38,34,32,0.22);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    overflow:hidden;
  }
  .app{ height:100%; display:flex; flex-direction:column; }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;border-bottom:1px solid var(--line);
    background:var(--paper); flex-shrink:0; gap:8px;
  }
  .topbar h1{ font-size:18px;margin:0;font-weight:800;letter-spacing:-0.2px; }
  .topbar .sub{ font-size:12px;color:var(--ink-soft);font-weight:500;margin-top:2px; }
  .topbar-actions{ display:flex;gap:8px;align-items:center;flex-shrink:0; }
  select#presetSelect{
    font-size:14px;font-weight:700;padding:9px 10px;border-radius:10px;
    border:1.5px solid var(--line);background:var(--paper);color:var(--ink);max-width:30vw;
  }
  button{ font-family:inherit;cursor:pointer;border:none; }
  .icon-btn{
    font-size:14px;font-weight:700;padding:9px 14px;border-radius:10px;
    background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);
  }
  .icon-btn:active{ transform:scale(0.96); }
  .ghost-btn{
    font-size:14px;font-weight:700;padding:9px 16px;border-radius:10px;
    background:transparent;border:1.5px solid var(--line-soft);color:var(--ink-soft);
  }
  .cta-btn{
    font-size:16px;font-weight:800;padding:12px 20px;border-radius:12px;
    background:var(--cta);color:var(--paper);
  }
  .cta-btn:active{ transform:scale(0.97); }
  .type-toggle{ display:flex;gap:8px;margin:6px 0 4px; }
  .type-btn{
    flex:1;padding:11px;border-radius:10px;font-weight:800;font-size:14px;
    background:var(--bg);border:1.5px solid var(--line-soft);color:var(--ink-soft);
  }
  .type-btn.active{ background:var(--cta);color:var(--paper);border-color:var(--cta); }

  .stage{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:16px;min-height:0;width:100%;
  }
  .quiz-card{
    width:100%;max-width:460px;
    background:var(--paper);border-radius:16px;padding:18px 20px;
    box-shadow:0 6px 16px rgba(38,34,32,0.12);
  }
  .quiz-eyebrow{ font-size:11px;font-weight:800;color:var(--cta);letter-spacing:1.5px;margin:0 0 8px; }
  .quiz-question{ font-size:17px;font-weight:800;line-height:1.45;margin:0;white-space:pre-line; }

  .answer-area{ width:100%;max-width:460px; }
  .ox-row{ display:flex;gap:14px; }
  .ox-btn{
    flex:1;aspect-ratio:1.4/1;border-radius:16px;font-size:40px;font-weight:900;
    background:var(--paper);border:3px solid var(--line-soft);color:var(--ink);
    box-shadow:0 4px 10px rgba(38,34,32,0.1);
  }
  .ox-btn:active{ transform:scale(0.96); }
  .mc-list{ display:flex;flex-direction:column;gap:10px; }
  .mc-btn{
    padding:14px 16px;border-radius:12px;font-size:15px;font-weight:700;text-align:left;
    background:var(--paper);border:2px solid var(--line-soft);color:var(--ink);
    box-shadow:0 3px 8px rgba(38,34,32,0.08);
  }
  .mc-btn:active{ transform:scale(0.98); }
  .answer-btn.correct{ background:var(--green);color:var(--paper);border-color:var(--green); }
  .answer-btn.wrong{ background:var(--red);color:var(--paper);border-color:var(--red); }
  .answer-btn.reveal{ border-color:var(--green);box-shadow:0 0 0 2px var(--green) inset; }
  .answer-btn[disabled]{ opacity:0.85; }

  .feedback-box{
    width:100%;max-width:460px;text-align:center;min-height:20px;
  }
  .feedback-text{ font-size:14px;font-weight:800;margin:0; }
  .feedback-text.correct{ color:var(--green); }
  .feedback-text.wrong{ color:var(--red); }
  .explain-text{ font-size:13px;color:var(--ink-soft);margin:4px 0 0;line-height:1.4; }

  .controls-row{ display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;flex-shrink:0; }
  .score-info{
    font-size:13px;font-weight:700;color:var(--ink-soft);
    background:var(--paper);padding:6px 12px;border-radius:20px;border:1px solid var(--line);
  }

  .overlay{
    position:fixed;inset:0;background:rgba(38,34,32,0.55);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay.hidden{ display:none; }
  .panel{
    background:var(--paper);border-radius:18px;padding:20px;
    width:min(92vw,480px);max-height:88vh;overflow:auto;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
  }
  .panel-head{ display:flex;justify-content:space-between;align-items:center;margin-bottom:8px; }
  .panel-head h2{ margin:0;font-size:18px;font-weight:800; }
  .panel .field-label{ display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:12px 0 6px; }
  .panel-row{ display:flex;gap:8px;margin-top:14px; }
  .panel-row .cta-btn, .panel-row .ghost-btn{ flex:1; }
  #presetNameInput{
    width:100%;font-size:15px;padding:11px 12px;border-radius:10px;
    border:1.5px solid var(--line);font-family:inherit;
  }
  .hint-text{ font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5; }

  .q-list{ display:flex;flex-direction:column;gap:6px;margin-bottom:6px; }
  .q-card{
    border:1.5px solid var(--line-soft);border-radius:10px;padding:10px 10px;
    background:var(--bg);display:flex;align-items:center;gap:8px;
  }
  .q-card-main{ flex:1;min-width:0; }
  .q-tag{
    flex-shrink:0;font-size:10.5px;font-weight:800;padding:5px 8px;border-radius:7px;color:var(--paper);
  }
  .q-tag.ox{ background:var(--blue); }
  .q-tag.mc{ background:var(--purple,#7B3F6B); }
  .q-tag.mc5{ background:var(--cta); }
  .q-text-preview{
    font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .q-answer-preview{ font-size:11.5px;color:var(--ink-soft);margin-top:2px; }
  .q-del{
    width:32px;height:32px;border-radius:8px;flex-shrink:0;
    background:var(--paper);border:1.5px solid var(--red);color:var(--red);
    font-size:15px;font-weight:800;
  }
  .q-del:active{ transform:scale(0.9); }

  .qedit-overlay{
    position:fixed;inset:0;background:rgba(38,34,32,0.6);
    display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;
  }
  .qedit-overlay.hidden{ display:none; }
  .qedit-card{ background:var(--paper);border-radius:16px;padding:20px;width:min(92vw,440px);max-height:88vh;overflow:auto; }
  .qedit-card h3{ margin:0 0 4px;font-size:16px;font-weight:800; }
  .qedit-card label{ display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:10px 0 4px; }
  .qedit-card input{
    width:100%;font-size:15px;padding:11px;border-radius:10px;
    border:1.5px solid var(--line-soft);font-family:inherit;background:var(--paper);color:var(--ink);
  }
  .ox-answer-row{ display:flex;gap:8px; }
  .ox-answer-btn{
    flex:1;padding:12px;border-radius:10px;font-weight:800;font-size:16px;
    background:var(--bg);border:1.5px solid var(--line-soft);color:var(--ink-soft);
  }
  .ox-answer-btn.selected{ background:var(--green);color:var(--paper);border-color:var(--green); }
  .opt-row{ display:flex;align-items:center;gap:8px;margin-top:8px; }
  .opt-row input{ flex:1;margin:0; }
  .opt-radio{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:var(--bg);border:1.5px solid var(--line-soft);font-weight:800;color:var(--ink-soft);
  }
  .opt-radio.selected{ background:var(--green);color:var(--paper);border-color:var(--green); }
  .opt-radio5{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:var(--bg);border:1.5px solid var(--line-soft);font-weight:800;color:var(--ink-soft);
  }
  .opt-radio5.selected{ background:var(--green);color:var(--paper);border-color:var(--green); }

  .result-card{
    background:var(--paper);border-radius:20px;padding:30px 26px;
    width:min(90vw,420px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.35);
    animation:popIn 0.35s cubic-bezier(0.2,0.8,0.2,1);
  }
  @keyframes popIn{ from{transform:scale(0.7);opacity:0;} to{transform:scale(1);opacity:1;} }
  .result-eyebrow{ margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:2px;color:var(--cta); }
  .result-text{ margin:0 0 22px;font-size:22px;font-weight:900;line-height:1.4; }
  .confetti-layer{ position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:49; }
  .confetti-piece{
    position:absolute;top:-20px;width:10px;height:16px;opacity:0.9;
    animation-name:fall;animation-timing-function:linear;animation-fill-mode:forwards;
  }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(540deg); opacity:0.2; } }
  .menu-back{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;margin-bottom:6px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px;font-weight:800;}
  @media(max-width:640px){
    .topbar{flex-wrap:wrap;gap:8px;padding:10px 12px;}
    .topbar>div:first-child{flex:1 1 100%;}
    .topbar h1{white-space:nowrap;}
    .topbar-actions{flex:1 1 100%;flex-wrap:wrap;justify-content:flex-start;}
    .topbar-actions select{max-width:none !important;flex:1 1 150px;min-height:44px;}
    .topbar-actions button{min-height:44px;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <a class="menu-back" href="index.html">← 메뉴</a>
      <h1>OX·객관식 퀴즈</h1>
      <div class="sub">여행바구니 · 어린이 역사체험</div>
    </div>
    <div class="topbar-actions">
      <select id="presetSelect"></select>
      <button id="editBtn" class="icon-btn">문제 편집</button>
    </div>
  </header>

  <main class="stage">
    <div class="quiz-card">
      <p class="quiz-eyebrow" id="quizEyebrow">문제 1 / 10</p>
      <p class="quiz-question" id="quizQuestion">-</p>
    </div>
    <div class="answer-area" id="answerArea"></div>
    <div class="feedback-box">
      <p class="feedback-text" id="feedbackText"></p>
      <p class="explain-text" id="explainText"></p>
    </div>
    <div class="controls-row">
      <span class="score-info" id="scoreInfo"></span>
      <button id="restartBtn" class="ghost-btn">다시 하기</button>
    </div>
  </main>
</div>

<div id="editOverlay" class="overlay hidden">
  <div class="panel">
    <div class="panel-head">
      <h2>문제 편집</h2>
      <button id="closeEdit" class="icon-btn">닫기</button>
    </div>
    <label class="field-label">탭해서 문제를 바꾸거나, ×로 삭제하세요</label>
    <div class="q-list" id="qList"></div>
    <div class="panel-row">
      <button id="addQuestionBtn" class="ghost-btn">+ 새 문제 추가</button>
    </div>

    <label class="field-label">다른 이름으로 저장 (선택)</label>
    <input type="text" id="presetNameInput" placeholder="예: 조선시대 퀴즈">
    <div class="panel-row">
      <button id="saveAsBtn" class="ghost-btn">이 이름으로 저장</button>
      <button id="deletePresetBtn" class="ghost-btn">이 목록 삭제</button>
    </div>
  </div>
</div>

<div id="qEditOverlay" class="qedit-overlay hidden">
  <div class="qedit-card">
    <h3 id="qEditTitle">문제 입력</h3>
    <div class="type-toggle">
      <button class="type-btn" id="typeOxBtn">OX 문제</button>
      <button class="type-btn" id="typeMcBtn">객관식(4지선다)</button>
      <button class="type-btn" id="typeMc5Btn">한능검 심화형(5지선다)</button>
    </div>

    <label class="field-label">문제 내용</label>
    <input type="text" id="qTextInput" placeholder="예: 세종대왕은 훈민정음을 창제했다.">

    <div id="oxFields">
      <label class="field-label">정답</label>
      <div class="ox-answer-row">
        <button class="ox-answer-btn" id="oxAnswerO">O</button>
        <button class="ox-answer-btn" id="oxAnswerX">X</button>
      </div>
    </div>

    <div id="mcFields">
      <label class="field-label">보기 (원을 탭해서 정답 표시)</label>
      <div class="opt-row"><button class="opt-radio" data-i="0">1</button><input type="text" id="opt0" placeholder="보기 1"></div>
      <div class="opt-row"><button class="opt-radio" data-i="1">2</button><input type="text" id="opt1" placeholder="보기 2"></div>
      <div class="opt-row"><button class="opt-radio" data-i="2">3</button><input type="text" id="opt2" placeholder="보기 3"></div>
      <div class="opt-row"><button class="opt-radio" data-i="3">4</button><input type="text" id="opt3" placeholder="보기 4"></div>
    </div>

    <div id="mc5Fields">
      <label class="field-label">보기 (원을 탭해서 정답 표시, 5개)</label>
      <div class="opt-row"><button class="opt-radio5" data-i="0">1</button><input type="text" id="opt5_0" placeholder="보기 1"></div>
      <div class="opt-row"><button class="opt-radio5" data-i="1">2</button><input type="text" id="opt5_1" placeholder="보기 2"></div>
      <div class="opt-row"><button class="opt-radio5" data-i="2">3</button><input type="text" id="opt5_2" placeholder="보기 3"></div>
      <div class="opt-row"><button class="opt-radio5" data-i="3">4</button><input type="text" id="opt5_3" placeholder="보기 4"></div>
      <div class="opt-row"><button class="opt-radio5" data-i="4">5</button><input type="text" id="opt5_4" placeholder="보기 5"></div>
    </div>

    <label class="field-label">해설 (선택, 정답 확인 후 보여줘요)</label>
    <input type="text" id="explainInput" placeholder="예: 1443년경 창제, 1446년 반포되었어요.">

    <div class="panel-row">
      <button id="qEditCancel" class="ghost-btn">취소</button>
      <button id="qEditConfirm" class="cta-btn">확인</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay hidden">
  <div class="result-card">
    <p class="result-eyebrow">결과</p>
    <p class="result-text" id="resultText">-</p>
    <button id="closeResult" class="cta-btn">다시 하기</button>
  </div>
</div>
<div id="confettiLayer" class="confetti-layer"></div>

<script>
(function(){
  var presets = {
    "OX 초급": {
      pool: [],
      questions: [
        {type:'ox', text:'세종대왕은 훈민정음을 창제했다.', answer:true, explain:'1443년경 창제하고 1446년에 반포했어요.'},
        {type:'ox', text:'이순신 장군은 임진왜란 때 활약했다.', answer:true, explain:'한산도 대첩, 명량 해전 등에서 큰 승리를 거뒀어요.'},
        {type:'ox', text:'고려는 조선보다 나중에 세워진 나라이다.', answer:false, explain:'고려(918년)가 조선(1392년)보다 먼저 세워졌어요.'},
        {type:'ox', text:'신라의 수도는 평양이었다.', answer:false, explain:'신라의 수도는 경주(금성)였어요. 평양은 고구려의 수도였어요.'},
        {type:'ox', text:'3·1 운동은 1919년에 일어났다.', answer:true, explain:'1919년 3월 1일에 전국적인 만세운동이 일어났어요.'},
        {type:'ox', text:'훈민정음은 한자를 완전히 없애기 위해 만든 문자이다.', answer:false, explain:'한자를 없애려던 게 아니라, 백성들이 쉽게 배워 쓸 수 있는 문자를 만들려던 목적이었어요.'},
        {type:'ox', text:'6·25 전쟁은 1950년에 시작되었다.', answer:true, explain:'1950년 6월 25일 새벽에 시작됐어요.'},
        {type:'ox', text:'경복궁은 조선의 궁궐이다.', answer:true, explain:'조선을 세운 태조 이성계가 지은 궁궐이에요.'},
        {type:'ox', text:'광개토대왕은 백제의 왕이었다.', answer:false, explain:'광개토대왕은 고구려의 왕이었어요.'},
        {type:'ox', text:'팔만대장경은 고려 시대에 만들어졌다.', answer:true, explain:'몽골의 침입을 부처의 힘으로 물리치기를 바라며 만들었어요.'},
        {type:'ox', text:'발해는 대조영이 세운 나라이다.', answer:true, explain:'고구려 유민과 말갈족이 함께 세운 나라예요.'},
        {type:'ox', text:'강감찬은 귀주대첩에서 거란을 물리쳤다.', answer:true, explain:'1019년, 고려를 침입한 거란군을 크게 물리쳤어요.'},
        {type:'ox', text:'이성계는 위화도 회군을 통해 권력을 잡았다.', answer:true, explain:'요동 정벌을 위해 나섰다가 군대를 돌려 개경으로 향했어요.'},
        {type:'ox', text:'판소리는 서양에서 전해진 음악이다.', answer:false, explain:'판소리는 우리나라 고유의 전통 음악이에요.'},
        {type:'ox', text:'첨성대는 조선시대에 만들어졌다.', answer:false, explain:'첨성대는 신라 선덕여왕 때 만들어졌어요.'},
        {type:'ox', text:'임진왜란은 16세기 말에 일어났다.', answer:true, explain:'1592년에 시작되었으니 16세기 말이 맞아요.'},
        {type:'ox', text:'대한민국 정부는 1948년에 수립되었다.', answer:true, explain:'1948년 8월 15일, 대한민국 정부 수립이 선포되었어요.'},
        {type:'ox', text:'팔만대장경은 종이로 인쇄된 책이다.', answer:false, explain:'팔만대장경은 나무판(목판)에 글자를 새긴 것이에요.'},
        {type:'ox', text:'세종대왕 때 측우기가 발명되었다.', answer:true, explain:'비가 내린 양을 재는 기구예요.'},
        {type:'ox', text:'6·25 전쟁은 인천상륙작전으로 시작되었다.', answer:false, explain:'전쟁은 1950년 6월 25일 북한의 남침으로 시작되었고, 인천상륙작전은 그 후 9월에 이루어진 반격 작전이에요.'}
      ]
    },
    "OX 중급": {
      pool: [],

        {type:'mc5', text:'세종이 젊고 재능 있는 관리들에게 휴가를 주어 학문과 독서에 전념하게 한 제도는?', options:['사가독서제','집현전','규장각','홍문관','성균관'], correctIndex:0, explain:'사가독서제는 관리들에게 휴가를 주어 학문에 전념하게 한 세종의 제도예요.'}
      ]
    }
  };
  var currentName = "OX 초급";

  var presetSelect = document.getElementById('presetSelect');
  var quizEyebrow = document.getElementById('quizEyebrow');
  var quizQuestion = document.getElementById('quizQuestion');
  var answerArea = document.getElementById('answerArea');
  var feedbackText = document.getElementById('feedbackText');
  var explainText = document.getElementById('explainText');
  var scoreInfo = document.getElementById('scoreInfo');
  var restartBtn = document.getElementById('restartBtn');

  var editOverlay = document.getElementById('editOverlay');
  var qList = document.getElementById('qList');
  var presetNameInput = document.getElementById('presetNameInput');

  var qEditOverlay = document.getElementById('qEditOverlay');
  var qEditTitle = document.getElementById('qEditTitle');
  var typeOxBtn = document.getElementById('typeOxBtn');
  var typeMcBtn = document.getElementById('typeMcBtn');
  var typeMc5Btn = document.getElementById('typeMc5Btn');
  var oxFields = document.getElementById('oxFields');
  var mcFields = document.getElementById('mcFields');
  var mc5Fields = document.getElementById('mc5Fields');
  var qTextInput = document.getElementById('qTextInput');
  var oxAnswerO = document.getElementById('oxAnswerO');
  var oxAnswerX = document.getElementById('oxAnswerX');
  var explainInput = document.getElementById('explainInput');
  var editingIdx = -1;
  var draftType = 'ox';
  var draftOxAnswer = true;
  var draftCorrectIndex = 0;
  var draftCorrectIndex5 = 0;

  var resultOverlay = document.getElementById('resultOverlay');
  var resultText = document.getElementById('resultText');
  var confettiLayer = document.getElementById('confettiLayer');

  var order = [];
  var qPointer = 0;
  var score = 0;
  var mode = 'answer';

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function refreshPresetSelect(){
    presetSelect.innerHTML = '';
    Object.keys(presets).forEach(function(name){
      var opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      if(name === currentName) opt.selected = true;
      presetSelect.appendChild(opt);
    });
  }

  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }

  var ROUND_SIZE = 10;

  function refillPool(name){
    var p = presets[name];
    if(!p.pool) p.pool = [];
    var qs = p.questions;
    var need = Math.min(ROUND_SIZE, qs.length);
    while(p.pool.length < need && qs.length > 0){
      p.pool = p.pool.concat(shuffle(qs.map(function(_,i){ return i; })));
    }
  }

  function startRound(){
    var qs = presets[currentName].questions;
    var roundSize = Math.min(ROUND_SIZE, qs.length);
    refillPool(currentName);
    order = presets[currentName].pool.splice(0, roundSize);
    qPointer = 0;
    score = 0;
    mode = 'answer';
    showQuestion();
  }

  function showQuestion(){
    var qs = presets[currentName].questions;
    if(qPointer >= order.length){
      finishRound();
      return;
    }
    var q = qs[order[qPointer]];
    quizEyebrow.textContent = '문제 ' + (qPointer+1) + ' / ' + order.length;
    quizQuestion.textContent = q.text;
    feedbackText.textContent = '';
    feedbackText.className = 'feedback-text';
    explainText.textContent = '';
    mode = 'answer';
    renderAnswerArea(q);
    updateScoreInfo();
  }

  function renderAnswerArea(q){
    answerArea.innerHTML = '';
    if(q.type === 'ox'){
      var row = document.createElement('div');
      row.className = 'ox-row';
      ['O','X'].forEach(function(label){
        var btn = document.createElement('button');
        btn.className = 'ox-btn answer-btn';
        btn.textContent = label;
        btn.addEventListener('click', function(){ onAnswer(label === 'O', btn); });
        row.appendChild(btn);
      });
      answerArea.appendChild(row);
    } else {
      var list = document.createElement('div');
      list.className = 'mc-list';
      q.options.forEach(function(opt, idx){
        var btn = document.createElement('button');
        btn.className = 'mc-btn answer-btn';
        btn.textContent = (idx+1) + '. ' + opt;
        btn.addEventListener('click', function(){ onAnswer(idx, btn); });
        list.appendChild(btn);
      });
      answerArea.appendChild(list);
    }
  }

  function updateScoreInfo(){
    scoreInfo.textContent = '맞은 개수 ' + score + ' / ' + Math.min(qPointer, order.length) + ' (진행 중 ' + Math.min(qPointer+1,order.length) + '/' + order.length + ')';
  }

  function finishRound(){
    resultText.textContent = order.length + '문제 중 ' + score + '개 맞혔어요!';
    resultOverlay.classList.remove('hidden');
    if(score === order.length) launchConfetti();
  }

  function onAnswer(picked, btnEl){
    if(mode !== 'answer') return;
    mode = 'locked';
    var qs = presets[currentName].questions;
    var q = qs[order[qPointer]];
    var buttons = answerArea.querySelectorAll('.answer-btn');
    Array.prototype.forEach.call(buttons, function(b){ b.disabled = true; });

    var isCorrect;
    if(q.type === 'ox'){
      isCorrect = (picked === q.answer);
      btnEl.classList.add(isCorrect ? 'correct' : 'wrong');
      if(!isCorrect){
        var correctLabel = q.answer ? 'O' : 'X';
        Array.prototype.forEach.call(buttons, function(b){
          if(b.textContent === correctLabel) b.classList.add('reveal');
        });
      }
    } else {
      isCorrect = (picked === q.correctIndex);
      btnEl.classList.add(isCorrect ? 'correct' : 'wrong');
      if(!isCorrect){
        buttons[q.correctIndex].classList.add('reveal');
      }
    }

    if(isCorrect){
      feedbackText.textContent = '정확해요!';
      feedbackText.className = 'feedback-text correct';
      score++;
    } else {
      feedbackText.textContent = '아쉬워요!';
      feedbackText.className = 'feedback-text wrong';
    }
    if(q.explain) explainText.textContent = q.explain;
    updateScoreInfo();

    setTimeout(function(){
      qPointer++;
      showQuestion();
    }, 1700);
  }

  restartBtn.addEventListener('click', startRound);
  document.getElementById('closeResult').addEventListener('click', function(){
    resultOverlay.classList.add('hidden');
    startRound();
  });

  presetSelect.addEventListener('change', function(){
    currentName = presetSelect.value;
    startRound();
  });

  // ---------- 편집 패널 ----------
  function renderEditPanel(){
    var qs = presets[currentName].questions;
    qList.innerHTML = '';
    qs.forEach(function(q, idx){
      var card = document.createElement('div');
      card.className = 'q-card';
      var answerPreview = q.type === 'ox' ? ('정답: ' + (q.answer ? 'O' : 'X')) : ('정답: ' + (q.correctIndex+1) + '번 ' + q.options[q.correctIndex]);
      card.innerHTML =
        '<span class="q-tag ' + q.type + '">' + (q.type === 'ox' ? 'OX' : (q.type === 'mc5' ? '심화(5지)' : '객관식')) + '</span>' +
        '<div class="q-card-main"><div class="q-text-preview"></div><div class="q-answer-preview"></div></div>' +
        '<button class="q-del" data-idx="'+idx+'">×</button>';
      card.querySelector('.q-text-preview').textContent = q.text;
      card.querySelector('.q-answer-preview').textContent = answerPreview;
      card.querySelector('.q-card-main').addEventListener('click', function(){ openEditExisting(idx); });
      card.querySelector('.q-del').addEventListener('click', function(e){
        if(qs.length <= 2){ alert('최소 2개의 문제가 있어야 합니다.'); return; }
        qs.splice(idx,1);
        presets[currentName].pool = [];
        renderEditPanel();
      });
      qList.appendChild(card);
    });
    presetNameInput.value = '';
  }

  function setDraftType(type){
    draftType = type;
    typeOxBtn.classList.toggle('active', type === 'ox');
    typeMcBtn.classList.toggle('active', type === 'mc');
    typeMc5Btn.classList.toggle('active', type === 'mc5');
    oxFields.style.display = type === 'ox' ? 'block' : 'none';
    mcFields.style.display = type === 'mc' ? 'block' : 'none';
    mc5Fields.style.display = type === 'mc5' ? 'block' : 'none';
  }
  typeOxBtn.addEventListener('click', function(){ setDraftType('ox'); });
  typeMcBtn.addEventListener('click', function(){ setDraftType('mc'); });
  typeMc5Btn.addEventListener('click', function(){ setDraftType('mc5'); });

  function setOxAnswer(val){
    draftOxAnswer = val;
    oxAnswerO.classList.toggle('selected', val === true);
    oxAnswerX.classList.toggle('selected', val === false);
  }
  oxAnswerO.addEventListener('click', function(){ setOxAnswer(true); });
  oxAnswerX.addEventListener('click', function(){ setOxAnswer(false); });

  function setCorrectIndex(i){
    draftCorrectIndex = i;
    Array.prototype.forEach.call(document.querySelectorAll('.opt-radio'), function(el){
      el.classList.toggle('selected', +el.getAttribute('data-i') === i);
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('.opt-radio'), function(el){
    el.addEventListener('click', function(){ setCorrectIndex(+el.getAttribute('data-i')); });
  });

  function setCorrectIndex5(i){
    draftCorrectIndex5 = i;
    Array.prototype.forEach.call(document.querySelectorAll('.opt-radio5'), function(el){
      el.classList.toggle('selected', +el.getAttribute('data-i') === i);
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('.opt-radio5'), function(el){
    el.addEventListener('click', function(){ setCorrectIndex5(+el.getAttribute('data-i')); });
  });

  function openEditExisting(idx){
    editingIdx = idx;
    var q = presets[currentName].questions[idx];
    qEditTitle.textContent = '문제 수정';
    qTextInput.value = q.text;
    explainInput.value = q.explain || '';
    if(q.type === 'ox'){
      setDraftType('ox');
      setOxAnswer(q.answer);
    } else if(q.type === 'mc5'){
      setDraftType('mc5');
      for(var i=0;i<5;i++) document.getElementById('opt5_'+i).value = q.options[i] || '';
      setCorrectIndex5(q.correctIndex);
    } else {
      setDraftType('mc');
      document.getElementById('opt0').value = q.options[0] || '';
      document.getElementById('opt1').value = q.options[1] || '';
      document.getElementById('opt2').value = q.options[2] || '';
      document.getElementById('opt3').value = q.options[3] || '';
      setCorrectIndex(q.correctIndex);
    }
    qEditOverlay.classList.remove('hidden');
    setTimeout(function(){ qTextInput.focus(); }, 50);
  }

  document.getElementById('addQuestionBtn').addEventListener('click', function(){
    editingIdx = -1;
    qEditTitle.textContent = '새 문제 입력';
    qTextInput.value = '';
    explainInput.value = '';
    document.getElementById('opt0').value = '';
    document.getElementById('opt1').value = '';
    document.getElementById('opt2').value = '';
    document.getElementById('opt3').value = '';
    for(var i=0;i<5;i++) document.getElementById('opt5_'+i).value = '';
    setDraftType('ox');
    setOxAnswer(true);
    setCorrectIndex(0);
    setCorrectIndex5(0);
    qEditOverlay.classList.remove('hidden');
    setTimeout(function(){ qTextInput.focus(); }, 50);
  });

  document.getElementById('qEditConfirm').addEventListener('click', function(){
    var text = qTextInput.value.trim();
    if(!text){ alert('문제 내용을 입력해 주세요.'); return; }
    var explain = explainInput.value.trim();
    var newQ;
    if(draftType === 'ox'){
      newQ = {type:'ox', text:text, answer:draftOxAnswer, explain:explain};
    } else if(draftType === 'mc5'){
      var opts5 = [];
      for(var i=0;i<5;i++) opts5.push(document.getElementById('opt5_'+i).value.trim());
      if(opts5.some(function(o){ return !o; })){
        alert('보기 5개를 모두 입력해 주세요.');
        return;
      }
      newQ = {type:'mc5', text:text, options:opts5, correctIndex:draftCorrectIndex5, explain:explain};
    } else {
      var opts = [
        document.getElementById('opt0').value.trim(),
        document.getElementById('opt1').value.trim(),
        document.getElementById('opt2').value.trim(),
        document.getElementById('opt3').value.trim()
      ];
      if(opts.some(function(o){ return !o; })){
        alert('보기 4개를 모두 입력해 주세요.');
        return;
      }
      newQ = {type:'mc', text:text, options:opts, correctIndex:draftCorrectIndex, explain:explain};
    }
    var qs = presets[currentName].questions;
    if(editingIdx === -1) qs.push(newQ);
    else qs[editingIdx] = newQ;
    presets[currentName].pool = [];
    qEditOverlay.classList.add('hidden');
    renderEditPanel();
  });
  document.getElementById('qEditCancel').addEventListener('click', function(){
    qEditOverlay.classList.add('hidden');
  });

  document.getElementById('editBtn').addEventListener('click', function(){
    renderEditPanel();
    editOverlay.classList.remove('hidden');
  });
  document.getElementById('closeEdit').addEventListener('click', function(){
    editOverlay.classList.add('hidden');
    startRound();
  });
  document.getElementById('saveAsBtn').addEventListener('click', function(){
    var name = presetNameInput.value.trim();
    if(!name){ alert('저장할 이름을 입력해 주세요.'); return; }
    presets[name] = { pool: [], questions: JSON.parse(JSON.stringify(presets[currentName].questions)) };
    currentName = name;
    refreshPresetSelect();
    renderEditPanel();
  });
  document.getElementById('deletePresetBtn').addEventListener('click', function(){
    var names = Object.keys(presets);
    if(names.length <= 1){ alert('마지막 남은 목록은 삭제할 수 없습니다.'); return; }
    delete presets[currentName];
    currentName = Object.keys(presets)[0];
    refreshPresetSelect();
    editOverlay.classList.add('hidden');
    startRound();
  });

  function launchConfetti(){
    var colors = ["#1F5C8B","#C1362E","#E3A72E","#3E7A5D","#CB6A2F"];
    for(var i=0;i<26;i++){
      var el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = (Math.random()*100) + 'vw';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      var dur = 1.6 + Math.random()*1.2;
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = (Math.random()*0.3) + 's';
      confettiLayer.appendChild(el);
      (function(node, d){ setTimeout(function(){ node.remove(); }, (d+0.5)*1000); })(el, dur);
    }
  }

  refreshPresetSelect();
  startRound();
})();
</script>
</body>
</html>
