<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>역사 빙고</title>
<style>
:root{
  --bg:#F7F1E1;--paper:#FBF8F0;--ink:#262220;--ink-soft:#6b6259;
  --blue:#1F5C8B;--red:#C1362E;--yellow:#E3A72E;--green:#3E7A5D;--cta:#CB6A2F;--purple:#7B3F6B;--teal:#2E7DA3;
  --line:rgba(38,34,32,0.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
.topbar a.back{min-height:44px;min-width:64px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:800;font-size:14px;padding:0 12px;}
.topbar .ttl{font-size:20px;font-weight:900;letter-spacing:-0.3px;}
.topbar .sub{font-size:12px;color:var(--ink-soft);font-weight:600;margin-left:auto;text-align:right;}
.topbar a.back{white-space:nowrap;flex:none;}
.topbar .ttl{white-space:nowrap;}
@media(max-width:560px){.topbar{padding:10px 12px;gap:10px;}.topbar .sub{display:none;}.topbar .ttl{font-size:18px;}.app{padding:12px 12px 32px;}}
.app{max-width:1000px;margin:0 auto;padding:16px 16px 40px;}
button{font-family:inherit;cursor:pointer;border:0;}
.btn{min-height:52px;padding:0 22px;border-radius:14px;font-size:17px;font-weight:800;color:#fff;background:var(--cta);box-shadow:0 4px 0 rgba(0,0,0,0.18);}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,0.18);}
.btn.blue{background:var(--blue);} .btn.red{background:var(--red);} .btn.green{background:var(--green);}
.btn.purple{background:var(--purple);} .btn.teal{background:var(--teal);}
.btn.yellow{background:var(--yellow);color:var(--ink);}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line);box-shadow:none;}
.btn.small{min-height:44px;font-size:15px;padding:0 14px;}
.btn[disabled]{opacity:.4;pointer-events:none;}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.center{text-align:center;}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;}
select.sel{min-height:48px;font-size:16px;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--paper);padding:0 12px;color:var(--ink);font-family:inherit;}
.stepper{display:inline-flex;align-items:center;gap:6px;}
.stepper button{width:48px;height:48px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-size:24px;font-weight:900;color:var(--ink);}
.stepper .val{min-width:44px;text-align:center;font-size:22px;font-weight:900;}
.hint{font-size:13px;color:var(--ink-soft);font-weight:600;}
/* modal */
.ov{position:fixed;inset:0;background:rgba(38,34,32,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;}
.ov.on{display:flex;}
.modal{background:var(--paper);border-radius:22px;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35);}
.modal h2{margin:0 0 12px;font-size:22px;font-weight:900;}
.modal .big{font-size:56px;text-align:center;line-height:1.1;margin:6px 0;}
.modal .msg{font-size:18px;font-weight:700;text-align:center;line-height:1.5;margin:6px 0 16px;}
.modal .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:200;}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:800;background:var(--bg);border:1px solid var(--line);}


.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px;}
.ctl label{font-size:13px;font-weight:800;color:var(--ink-soft);margin-right:4px;}
.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start;}
@media(max-width:760px){.layout{grid-template-columns:1fr;}}
.board{display:grid;gap:8px;}
.cell{aspect-ratio:1/0.82;border-radius:14px;background:var(--paper);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font-weight:900;word-break:keep-all;line-height:1.2;position:relative;}
.cell{min-width:0;overflow:hidden;}
.b3 .cell{font-size:clamp(14px,min(4.2vw,3vw + 6px),30px);} .b4 .cell{font-size:clamp(13px,min(3.4vw,1.6vw + 4px),24px);}
.cell.t0{background:var(--blue);color:#fff;border-color:var(--blue);}
.cell.t1{background:var(--red);color:#fff;border-color:var(--red);}
.cell.line{outline:5px solid var(--yellow);}
.cell.target{animation:blink .7s infinite alternate;border-color:var(--cta);}
@keyframes blink{from{background:var(--paper)}to{background:#F6D9B8}}
.side .panel{margin-bottom:12px;}
.qh{font-size:clamp(20px,3.8vw,30px);font-weight:800;line-height:1.5;word-break:keep-all;min-height:90px;display:flex;align-items:center;justify-content:center;text-align:center;}
.turn{text-align:center;font-size:20px;font-weight:900;margin-bottom:8px;}
.turn.t0{color:var(--blue)} .turn.t1{color:var(--red)}
.score{display:flex;gap:10px;justify-content:center;margin-bottom:10px;}
.score .pill{font-size:15px;padding:6px 14px;}
.acts2{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px;}
.acts2 .btn{min-width:140px;min-height:60px;font-size:19px;}

</style>
</head>
<body>
<div class="topbar"><a class="back" href="index.html">← 메뉴</a><div class="ttl">역사 빙고</div><div class="sub">여행바구니 · 어린이 역사체험</div></div>
<div class="app">

<div class="ctl">
  <div><label>주제</label><select class="sel" id="topic"></select></div>
  <div><label>판 크기</label><select class="sel" id="size"><option value="3">3×3</option><option value="4" selected>4×4</option></select></div>
  <div><label>방식</label><select class="sel" id="mode"><option value="1">다 함께</option><option value="2" selected>두 팀 대결</option></select></div>
  <div><label>목표</label><select class="sel" id="goal"><option value="1">1줄</option><option value="2" selected>2줄</option><option value="3">3줄</option></select></div>
  <button class="btn ghost small" id="newb" style="margin-left:auto">🔄 새 판</button>
</div>
<div class="layout">
  <div class="board" id="board"></div>
  <div class="side">
    <div class="panel">
      <div class="turn" id="turn"></div>
      <div class="score" id="score"></div>
      <div class="qh" id="qh">문제 뽑기를 눌러 시작해요</div>
      <div class="acts2" id="ac"></div>
    </div>
    <div class="hint center">설명을 듣고 칸의 정답을 맞히면 그 칸을 차지해요. 가로·세로·대각선으로 줄을 만들어요!</div>
  </div>
</div>

</div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<canvas id="confetti"></canvas>
<script>

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
/* 셔플백: 문제 은행이 다 소진될 때까지 중복 없이 n개씩 뽑는다 */
function makeBag(){return {pool:[]};}
function takeRound(bag,all,n){
  n=Math.min(n,all.length);
  const out=[];
  while(out.length<n){
    if(bag.pool.length===0){
      let fresh=shuffle(all.map((_,i)=>i));
      // 직전 라운드와 연속 중복 방지
      fresh=fresh.filter(i=>!out.includes(i)).concat(fresh.filter(i=>out.includes(i)));
      bag.pool=fresh;
    }
    const i=bag.pool.shift();
    if(!out.includes(i))out.push(i);
  }
  return out.map(i=>all[i]);
}
/* 소리 */
let _ac=null;
function beep(f,d,type){
  try{
    _ac=_ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=_ac.createOscillator(),g=_ac.createGain();
    o.type=type||'sine';o.frequency.value=f;g.gain.value=0.12;
    o.connect(g);g.connect(_ac.destination);o.start();
    g.gain.exponentialRampToValueAtTime(0.0001,_ac.currentTime+(d||0.15));
    o.stop(_ac.currentTime+(d||0.15)+0.02);
  }catch(e){}
}
function sndOk(){beep(660,.12);setTimeout(()=>beep(880,.18),110);}
function sndNo(){beep(220,.25,'square');}
function sndTick(){beep(520,.06);}
function sndAlarm(){let k=0;const t=setInterval(()=>{beep(k%2?880:660,.22,'triangle');if(++k>=6)clearInterval(t);},260);}
/* 폭죽 */
function confetti(){
  let cv=$('#confetti');if(!cv)return;
  const ctx=cv.getContext&&cv.getContext('2d');if(!ctx)return;
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#1F5C8B','#C1362E','#E3A72E','#3E7A5D','#CB6A2F','#7B3F6B','#2E7DA3'];
  const ps=Array.from({length:90},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*0.4,
    vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:6+Math.random()*8,c:pick(cols),r:Math.random()*6}));
  let f=0;
  (function step(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.2;ctx.fillStyle=p.c;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});
    if(++f<110)requestAnimationFrame(step);else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}
/* 모달: body는 HTML, buttons=[{t,cls,fn}] */
function modal(o){
  const ov=$('#ov'),m=$('#modal');
  m.innerHTML=(o.title?'<h2>'+esc(o.title)+'</h2>':'')+(o.icon?'<div class="big">'+o.icon+'</div>':'')+
    (o.msg?'<div class="msg">'+o.msg+'</div>':'')+(o.html||'')+'<div class="acts" id="macts"></div>';
  const acts=$('#macts');
  (o.buttons||[{t:'확인'}]).forEach(b=>{
    const el=document.createElement('button');el.className='btn '+(b.cls||'');el.textContent=b.t;
    el.onclick=()=>{ if(b.keep!==true)closeModal(); if(b.fn)b.fn(); };
    acts.appendChild(el);
  });
  ov.classList.add('on');
}

const TN=['파랑팀','빨강팀'];
let board=[],owner=[],n=4,teams=2,goal=2,turn=0,cur=-1,revealed=false,over=false,usedBoard=makeBag();
const ts=$('#topic');
Object.keys(BANK).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;ts.appendChild(o);});
['topic','size','mode','goal'].forEach(id=>{$('#'+id).onchange=()=>{if(id==='size'){$('#goal').value=$('#size').value==='3'?'1':'2';}newBoard();};});
$('#newb').onclick=()=>newBoard();
const bagMap={};
function newBoard(){
  const t=ts.value;n=+$('#size').value;teams=+$('#mode').value;goal=+$('#goal').value;
  bagMap[t]=bagMap[t]||makeBag();
  board=takeRound(bagMap[t],BANK[t],n*n);
  owner=Array(n*n).fill(null);turn=0;cur=-1;revealed=false;over=false;
  $('#qh').textContent='문제 뽑기를 눌러 시작해요';
  render();
}
function lines(t){
  const L=[];
  for(let r=0;r<n;r++){L.push([...Array(n)].map((_,c)=>r*n+c));}
  for(let c=0;c<n;c++){L.push([...Array(n)].map((_,r)=>r*n+c));}
  L.push([...Array(n)].map((_,i)=>i*n+i));
  L.push([...Array(n)].map((_,i)=>i*n+(n-1-i)));
  return L.filter(l=>l.every(i=>owner[i]===t));
}
function render(){
  const b=$('#board');b.className='board b'+n;b.style.gridTemplateColumns='repeat('+n+',1fr)';b.innerHTML='';
  const lineCells=new Set();for(let t=0;t<teams;t++)lines(t).forEach(l=>l.forEach(i=>lineCells.add(i)));
  board.forEach((it,i)=>{
    const d=document.createElement('div');
    d.className='cell'+(owner[i]!==null?' t'+owner[i]:'')+(lineCells.has(i)?' line':'')+(revealed&&i===cur?' target':'');
    d.textContent=it[0];b.appendChild(d);
  });
  const tn=$('#turn');
  if(teams===2&&!over){tn.className='turn t'+turn;tn.textContent='👉 '+TN[turn]+' 차례';}else{tn.className='turn';tn.textContent=over?'게임 끝!':'다 함께 도전!';}
  const sc=$('#score');sc.innerHTML='';
  for(let t=0;t<teams;t++){const p=document.createElement('span');p.className='pill';p.textContent=(teams===2?TN[t]:'우리 반')+' '+lines(t).length+'줄 · '+owner.filter(o=>o===t).length+'칸';sc.appendChild(p);}
  acts();
}
function acts(){
  const ac=$('#ac');ac.innerHTML='';
  const mk=(t,cls,fn)=>{const b=document.createElement('button');b.className='btn '+cls;b.textContent=t;b.onclick=fn;ac.appendChild(b);};
  if(over){mk('🔄 새 판','green',()=>newBoard());return;}
  if(cur<0)mk('🎲 문제 뽑기','cta',draw);
  else if(!revealed)mk('👀 정답 보기','purple',()=>{revealed=true;sndTick();render();});
  else{mk('👍 맞혔어요','green',()=>result(true));mk('😅 못 맞혔어요','ghost',()=>result(false));}
}
function draw(){
  const free=board.map((_,i)=>i).filter(i=>owner[i]===null);
  if(!free.length){finish();return;}
  cur=pick(free);revealed=false;
  $('#qh').textContent=board[cur][1]+'?';sndTick();render();
}
function result(ok){
  if(ok){owner[cur]=turn;sndOk();}else sndNo();
  const t=turn;
  if(ok&&lines(t).length>=goal){over=true;cur=-1;render();win(t);return;}
  if(!owner.some(o=>o===null)){over=true;cur=-1;render();finish();return;}
  if(teams===2)turn=1-turn;
  cur=-1;revealed=false;
  $('#qh').textContent=ok?'좋아요! 다음 문제를 뽑아요':'아쉬워요! 다음 문제를 뽑아요';
  render();
}
function win(t){
  confetti();sndOk();
  modal({icon:'🏆',title:teams===2?TN[t]+' 승리!':'빙고 성공!',msg:lines(t).length+'줄을 완성했어요!',buttons:[{t:'새 판',cls:'green',fn:()=>newBoard()},{t:'닫기',cls:'ghost'}]});
}
function finish(){
  over=true;render();
  const a=lines(0).length,b=teams===2?lines(1).length:0;
  if(teams===2){
    const m=a===b?'무승부예요!':(a>b?TN[0]:TN[1])+' 승리!';
    modal({icon:a===b?'🤝':'🏆',title:'모든 칸 완료',msg:m+'<br>'+TN[0]+' '+a+'줄 · '+TN[1]+' '+b+'줄',buttons:[{t:'새 판',cls:'green',fn:()=>newBoard()},{t:'닫기',cls:'ghost'}]});
  }else modal({icon:'🎉',title:'모든 칸 완료',msg:a+'줄을 만들었어요!',buttons:[{t:'새 판',cls:'green',fn:()=>newBoard()},{t:'닫기',cls:'ghost'}]});
}
newBoard();

</script>
</body>
</html>
